[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screenshotter-ai"
version = "0.2.0"
description = "ScreenshotterAI — AI-powered screenshot tool for macOS. Capture, analyze, and extract text from your screen with streaming AI, smart detection, and a Wispr Flow-style overlay."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ScreenshotterAI"}]

dependencies = [
    "rumps>=0.4.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "google-generativeai>=0.8.0",
    "pynput>=1.7.6",
    "pyperclip>=1.8.2",
    "kaggle>=1.6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
ai-screenshot = "ai_screenshot.cli:main"
ai-screenshot-gui = "ai_screenshot.app:main"
ai-screenshot-kaggle = "ai_screenshot.kaggle_data:main"

[tool.setuptools.packages.find]
include = ["ai_screenshot*"]
